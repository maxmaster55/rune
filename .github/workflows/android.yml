name: android

# Builds and links examples/android-hello for aarch64-linux-android against the NDK the Linux
# runner already has, at API 29 (the APK's minimum SDK), so a symbol newer than that fails the
# link here rather than on a phone. It does not run the app: there is no device or emulator.
# Per push to dev, on request, and per pull request that touches the Android-only code; a shared
# change that breaks Android shows on the push. `research/40-android.md`.
on:
  push:
    branches: [dev]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/android.yml"
      - "Cargo.lock"
      - "crates/rune/Cargo.toml"
      - "crates/rune/src/platform/android*"
      - "crates/rune/src/text/system_fonts/android*"
      - "examples/android-hello/**"
      - "vendor/winit/**"
      - "vendor/winit.patch"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml picks the toolchain; this adds the target to it.
      - run: rustup target add aarch64-linux-android
      - name: NDK clang as compiler and linker
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$bin/aarch64-linux-android29-clang"
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android29-clang"
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android29-clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "NM=$bin/llvm-nm"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-linux-android
      - run: cargo build -p android-hello --target aarch64-linux-android
      # NativeActivity loads libmain.so and looks up ANativeActivity_onCreate, which the glue
      # exports. The glue's call to the app's android_main is resolved by the link above.
      - name: libmain.so exports the activity's entry point
        run: |
          "$NM" -D --defined-only target/aarch64-linux-android/debug/libmain.so | grep -w ANativeActivity_onCreate
